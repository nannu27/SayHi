// apply plugin: 'com.google.gms.google-services'





plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id "dev.flutter.flutter-gradle-plugin"
    // id 'com.google.gms.google-services' // Uncomment if using Firebase
}

android {
    namespace "com.tqapp.android"
    compileSdk 35
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.tqapp.android"
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 🛠️ Fix for duplicate classes from play-core & core-common
   configurations.all {
    exclude group: 'com.google.android.play', module: 'core-common'
}

}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    
    // ✅ Exclude the conflicting module from core
    implementation('com.google.android.play:core:1.10.3') 

    implementation 'com.google.android.play:core-ktx:1.8.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.multidex:multidex:2.0.1'

    // New Dependency added
    implementation "androidx.window:window:1.2.0"
    // implementation "androidx.window:window-extensions:1.0.0"
}


// 🔥 If using Firebase, make sure this is applied at the bottom
apply plugin: 'com.google.gms.google-services'
